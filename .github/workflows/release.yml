name: Release

# A version tag (v0.1.0) builds the distributions once, publishes them to TestPyPI, then to PyPI.
# Both uploads use trusted publishing (OIDC): no API token exists anywhere. Each index trusts
# this repository, this file (release.yml) and one environment by name: `testpypi` and `pypi`.
# The `pypi` environment requires a maintainer's approval, which is the gate between checking
# the TestPyPI upload and the real one.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - name: The tag names the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - run: uv build
      - name: The wheel installs and imports on its own
        run: uv run --isolated --no-project --with dist/*.whl python -c "import pgbulkhead; print(pgbulkhead.__name__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pgbulkhead
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pgbulkhead
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
